name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., v1.0.0 or debug-latest)'
        required: false
        type: string
        default: 'debug-latest'
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'TokoReader Debug APK Release'

permissions:
  contents: write

jobs:
  build_and_release:
    name: 🚀 Build & Direct GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: 🔑 Restore Environment & Keystore
        run: |
          echo "Setting up .env file..."
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          echo "Restoring debug.keystore..."
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore successfully generated from base64."
          fi

          echo "Ensuring gradle-wrapper.jar exists..."
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            curl -sLo gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.12.1/gradle/wrapper/gradle-wrapper.jar" || \
            curl -sLo gradle/wrapper/gradle-wrapper.jar "https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar"
          fi

          chmod +x ./gradlew || true

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 📦 Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🏷️ Prepare APK Release Files
        run: |
          cd app/build/outputs/apk/debug
          cp app-debug.apk TokoReader-debug.apk
          sha256sum TokoReader-debug.apk > TokoReader-debug.apk.sha256
          echo "Generated APK SHA256:"
          cat TokoReader-debug.apk.sha256

      - name: 🏷️ Determine Tag & Title
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            TITLE="${{ github.event.inputs.release_title }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Release $TAG"
          else
            TAG="debug-latest"
            TITLE="TokoReader Latest Debug Build"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: 🚀 Publish Direct to GitHub Releases (No Artifact Storage Used)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/TokoReader-debug.apk
            app/build/outputs/apk/debug/TokoReader-debug.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
