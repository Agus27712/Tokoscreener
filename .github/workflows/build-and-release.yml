name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release?'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g., v1.0.0, default: auto-generated timestamp tag)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'TokoReader Debug APK Release'

permissions:
  contents: write

jobs:
  build:
    name: 🛠️ Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: 🔑 Restore Environment & Keystore
        run: |
          echo "Setting up .env file..."
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          echo "Restoring debug.keystore..."
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore successfully generated from base64."
          fi

          chmod +x ./gradlew || true

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 📦 Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🏷️ Prepare APK Artifact & Checksum
        run: |
          cd app/build/outputs/apk/debug
          cp app-debug.apk TokoReader-debug.apk
          sha256sum TokoReader-debug.apk > TokoReader-debug.apk.sha256
          echo "Generated APK SHA256:"
          cat TokoReader-debug.apk.sha256

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoReader-Debug-APK
          path: |
            app/build/outputs/apk/debug/TokoReader-debug.apk
            app/build/outputs/apk/debug/TokoReader-debug.apk.sha256
          retention-days: 14

      - name: 🚀 Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/TokoReader-debug.apk
            app/build/outputs/apk/debug/TokoReader-debug.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
